# Builds the web prototype (web/) and publishes it to GitHub Pages.
# One-time setup: Settings > Pages > Source: GitHub Actions. The repo must be public
# (or on a plan that allows Pages for private repos).
name: Deploy web prototype

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'rules/**'
      - 'config/**'
      - 'app/shared/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
        working-directory: web
      - name: Typecheck and build
        run: npm run build
        working-directory: web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
